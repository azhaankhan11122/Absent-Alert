<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Student</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <h2>Edit Student</h2>
        <div class="card">
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label>Name</label>
                        <input type="text" name="name" class="form-control" value="{{ student.name }}" required>
                    </div>
                    <div class="mb-3">
                        <label>Roll Number</label>
                        <input type="text" name="roll_number" class="form-control" value="{{ student.roll_number }}" required>
                    </div>
                    <div class="mb-3">
                        <label>Class</label>
                        <input type="text" name="class_name" class="form-control" value="{{ student.class_name }}" required>
                    </div>
                    <div class="mb-3">
                        <label>Student Phone</label>
                        <input type="text" name="phone_number" class="form-control" value="{{ student.phone_number }}">
                    </div>
                    <div class="mb-3">
                        <label>Parent Phone (for SMS)</label>
                        <input type="text" name="parent_phone" class="form-control" value="{{ student.parent_phone }}" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                    <a href="{{ url_for('students') }}" class="btn btn-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
